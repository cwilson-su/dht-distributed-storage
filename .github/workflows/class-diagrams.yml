name: Auto Generate UML Diagrams

on:
  push:
    branches: [ main ]

jobs:
  generate-uml:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download PlantUML
      run: |
        curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2023.9/plantuml.jar

    - name: Set up Maven
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install JavaParser
      run: |
        mkdir -p tools
        cd tools
        curl -L -o javaparser-core.jar https://repo1.maven.org/maven2/com/github/javaparser/javaparser-core/3.25.4/javaparser-core-3.25.4.jar

    - name: Generate UML diagrams with JavaParser
      run: |
        mkdir -p diagrams
        for folder in src/*/; do
          foldername=$(basename "$folder")
          outfile="diagrams/$foldername.puml"
          echo "@startuml" > $outfile
          echo "skinparam classAttributeIconSize 0" >> $outfile

          # Loop through Java files and parse class structure
          for file in "$folder"*.java; do
            java -cp tools/javaparser-core.jar com.github.javaparser.utils.SourceRoot "$folder" \
              | while read class_line; do
                # Example: we can just append the class name
                echo "$class_line" >> $outfile
              done
          done

          echo "@enduml" >> $outfile
        done

    - name: Render diagrams
      run: |
        for puml in diagrams/*.puml; do
          java -jar plantuml.jar -tpng $puml
        done

    - name: Commit diagrams
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Auto-generated UML diagrams"
        commit_user_name: "github-actions"
        commit_user_email: "actions@github.com"
